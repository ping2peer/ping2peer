AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Ping2Peer Signalling Server — WebSocket API for device discovery and WebRTC handshake relay.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128

Resources:
  # ---------------------------------------------------------------------------
  # API Gateway WebSocket API
  # ---------------------------------------------------------------------------
  SignalWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: Ping2PeerSignalling
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.type"

  # Routes
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SignalWebSocketApi
      RouteKey: "$connect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${ConnectIntegration}"

  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SignalWebSocketApi
      RouteKey: "$disconnect"
      AuthorizationType: NONE
      Target: !Sub "integrations/${DisconnectIntegration}"

  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SignalWebSocketApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Sub "integrations/${DefaultIntegration}"

  # Integrations
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations"

  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations"

  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations"

  # Stage (auto-deploy)
  ProductionStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SignalWebSocketApi
      StageName: prod
      AutoDeploy: true

  # ---------------------------------------------------------------------------
  # Lambda Function
  # ---------------------------------------------------------------------------
  SignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Ping2PeerSignalling
      Handler: lambda_handler.handler
      CodeUri: .
      Environment:
        Variables:
          CONNECTIONS_TABLE: !Ref ConnectionsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - Statement:
            - Effect: Allow
              Action:
                - execute-api:ManageConnections
              Resource:
                - !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*"

  # Lambda permissions for API Gateway to invoke
  SignalFunctionConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$connect"

  SignalFunctionDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$disconnect"

  SignalFunctionDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$default"

  # ---------------------------------------------------------------------------
  # DynamoDB Table
  # ---------------------------------------------------------------------------
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Ping2Peer-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: connectionId
          AttributeType: S
        - AttributeName: networkGroup
          AttributeType: S
      KeySchema:
        - AttributeName: connectionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: networkGroup-index
          KeySchema:
            - AttributeName: networkGroup
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  WebSocketUrl:
    Description: "WebSocket URL for the signalling server"
    Value: !Sub "wss://${SignalWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  
  SignalFunctionArn:
    Description: "Lambda function ARN"
    Value: !GetAtt SignalFunction.Arn
