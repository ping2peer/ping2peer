AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Ping2Peer Signalling Server \u2014 WebSocket API for device discovery\
  \ and WebRTC handshake relay."
Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 128
Resources:
  SignalWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: Ping2PeerSignalling
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.type
  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      RouteKey: $connect
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${ConnectIntegration}
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      RouteKey: $disconnect
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${DisconnectIntegration}
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      RouteKey: $default
      AuthorizationType: NONE
      Target:
        Fn::Sub: integrations/${DefaultIntegration}
  ConnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations
  DisconnectIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations
  DefaultIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::Sub: arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SignalFunction.Arn}/invocations
  ProductionStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: SignalWebSocketApi
      StageName: prod
      AutoDeploy: true
  SignalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: Ping2PeerSignalling
      Handler: lambda_handler.handler
      CodeUri: SignalFunction
      Environment:
        Variables:
          CONNECTIONS_TABLE:
            Ref: ConnectionsTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ConnectionsTable
      - Statement:
        - Effect: Allow
          Action:
          - execute-api:ManageConnections
          Resource:
          - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*
    Metadata:
      SamResourceId: SignalFunction
  SignalFunctionConnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$connect
  SignalFunctionDisconnectPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$disconnect
  SignalFunctionDefaultPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: SignalFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SignalWebSocketApi}/*/$default
  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Ping2Peer-connections
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: connectionId
        AttributeType: S
      - AttributeName: networkGroup
        AttributeType: S
      KeySchema:
      - AttributeName: connectionId
        KeyType: HASH
      GlobalSecondaryIndexes:
      - IndexName: networkGroup-index
        KeySchema:
        - AttributeName: networkGroup
          KeyType: HASH
        Projection:
          ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
Outputs:
  WebSocketUrl:
    Description: WebSocket URL for the signalling server
    Value:
      Fn::Sub: wss://${SignalWebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/prod
  SignalFunctionArn:
    Description: Lambda function ARN
    Value:
      Fn::GetAtt:
      - SignalFunction
      - Arn
